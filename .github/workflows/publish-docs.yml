name: Test and Deploy Core-Utils Docs

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Push Docker Image
        run: |
          docker build -t core-utils-docs .
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag core-utils-docs ${{ secrets.DOCKER_USERNAME }}/core-utils-docs:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/core-utils-docs:latest

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Update Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/core-utils-docs:latest
            
            sudo docker stop core-utils-docs || true
            sudo docker rm core-utils-docs || true
            
            # Menjalankan kontainer dan memetakannya di port 8080 (seperti default Anda)
            sudo docker run -d \
              --name core-utils-docs \
              --restart always \
              -p 8080:80 \
              ${{ secrets.DOCKER_USERNAME }}/core-utils-docs:latest
            
            sudo docker image prune -f
